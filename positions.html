<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c5fd4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Positions · Coach Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one column on phones (picker, players, pitch, tools, coaching card); pitch left + panel right on wide screens */
:root {
  --bg: #e7ece6; --surface: #ffffff; --fg: #15221a; --muted: #56675c; --line: #cfd9d0;
  --kit: #1c5fd4; --kit-ink: #ffffff; --opp: #d7383b; --gold: #f5b800; --gold-ink: #1d1600;
  --good: #1d8a4b; --warn: #a86a00; --bad: #c03a2b;
  --grass1: #2f7e3c; --grass2: #2a7436; --chalk: rgba(255,255,255,.82); --ink-draw: #ffe14d;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1410; --surface: #16201a; --fg: #e5ede7; --muted: #93a49a; --line: #2a3a30;
    --kit: #3f84ff; --good: #43c27a; --warn: #e3a63c; --bad: #f06b5c;
    --grass1: #266b32; --grass2: #22622d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1410; --surface: #16201a; --fg: #e5ede7; --muted: #93a49a; --line: #2a3a30;
  --kit: #3f84ff; --good: #43c27a; --warn: #e3a63c; --bad: #f06b5c;
  --grass1: #266b32; --grass2: #22622d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.app { max-width: 1060px; margin: 0 auto; padding: 12px 16px 28px; }
.hub { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .05em; text-transform: uppercase; text-decoration: none; color: var(--fg); border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; align-self: center; }
body { margin: 0; padding-top: env(safe-area-inset-top, 0px); }
.top { display: flex; align-items: baseline; gap: 10px; padding-block: 4px 10px; }
.top h1 { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: .01em; margin: 0; text-transform: uppercase; }
.formation { font-family: var(--display); font-weight: 700; font-size: 26px; color: var(--kit); }
.top .sub { color: var(--muted); font-size: 13px; margin-left: auto; }

.layout { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "pick" "chips" "pitch" "tools" "info"; }
.pick { grid-area: pick; } .chips-wrap { grid-area: chips; } .board { grid-area: pitch; }
.tools { grid-area: tools; } .info { grid-area: info; }
@media (min-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto auto auto 1fr;
    grid-template-areas: "pitch pick" "pitch chips" "pitch tools" "pitch info"; align-items: start; column-gap: 24px; }
}

.label { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.pick-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 6px; }
select, button { font: inherit; color: inherit; }
select { width: 100%; min-width: 0; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; font-weight: 600; }
.icon-btn { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 22px; line-height: 1; cursor: pointer; }
.brief { margin: 8px 0 0; color: var(--fg); }

.chips { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
.chip { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .03em; padding: 0; }
.chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.chip small { display: block; font-size: 10px; font-weight: 600; opacity: .7; margin-top: -3px; }
.posname { margin-top: 6px; font-size: 13px; color: var(--muted); }

.pitch-wrap { width: 100%; max-height: 78dvh; aspect-ratio: 112 / 162; margin-inline: auto; max-width: 100%; }
@media (max-width: 819px) { .pitch-wrap { max-height: 70dvh; } }
#pitch { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 10px; background: var(--grass2); }
#pitch.drawing { cursor: crosshair; }
.stripe-a { fill: var(--grass1); } .stripe-b { fill: var(--grass2); }
.chalk { fill: none; stroke: var(--chalk); stroke-width: .5; }
.chalk-dot { fill: var(--chalk); }
.goal { fill: rgba(255,255,255,.25); stroke: var(--chalk); stroke-width: .5; }
.tok { cursor: grab; }
.tok .hit { fill: transparent; }
.tok .body { stroke: rgba(0,0,0,.35); stroke-width: .35; }
.us .body { fill: var(--kit); } .us text { fill: var(--kit-ink); }
.us.sel .body { fill: var(--gold); stroke: #fff; stroke-width: .7; } .us.sel text { fill: var(--gold-ink); }
.us.sel .halo { fill: none; stroke: var(--gold); stroke-width: .5; opacity: .55; }
.them .body { fill: var(--opp); }
.tok text { font-family: var(--display); font-weight: 700; font-size: 3.3px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.ball .body { fill: #fff; stroke: #111; stroke-width: .35; }
.ball .patch { fill: #111; }
.locked { cursor: default; }
.ghost circle { fill: rgba(245,184,0,.18); stroke: var(--gold); stroke-width: .55; stroke-dasharray: 1.4 1; }
.ghost text { fill: #fff; font-family: var(--display); font-weight: 700; font-size: 2.8px; text-anchor: middle; }
.lane { stroke-width: .7; stroke-dasharray: 2 1.2; fill: none; }
.lane.open { stroke: #9dff9d; } .lane.blocked { stroke: #ff8a80; }
.danger { stroke: rgba(255,255,255,.55); stroke-width: .5; stroke-dasharray: 1 1.4; fill: none; }
.move-arrow { stroke: var(--gold); stroke-width: .7; fill: none; }
.arrowhead { fill: var(--gold); }
.stroke { fill: none; stroke: var(--ink-draw); stroke-width: .9; stroke-linecap: round; stroke-linejoin: round; }

.legend { display: flex; align-items: center; gap: 8px; margin: 8px 2px 0; font-size: 13px; color: var(--muted); min-height: 20px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

.tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.btn { height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .05em; text-transform: uppercase; }
.btn.primary { background: var(--kit); border-color: var(--kit); color: var(--kit-ink); grid-column: span 2; }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn:disabled { opacity: .4; cursor: default; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.info { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.card h2 { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.1; margin: 0 0 6px; text-wrap: balance; }
.card p { margin: 0; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 700; font-size: 14px;
  letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; margin-bottom: 8px; color: #fff; }
.badge.good { background: var(--good); } .badge.warn { background: var(--warn); } .badge.bad { background: var(--bad); }
.metres { font-size: 13px; color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
.ask { border-left: 4px solid var(--gold); }
.hint { font-size: 13px; color: var(--muted); margin-top: 8px !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <a class="hub" href="./#plan">‹ Hub</a>
    <span class="formation">3-1-3-1</span><h1>Shape Trainer</h1>
    <span class="sub">9-a-side</span>
  </header>

  <main class="layout">
    <section class="pick">
      <div class="label">Scenario</div>
      <div class="pick-row">
        <button class="icon-btn" id="prev" aria-label="Previous scenario">‹</button>
        <select id="scenario" aria-label="Scenario"></select>
        <button class="icon-btn" id="next" aria-label="Next scenario">›</button>
      </div>
      <p class="brief" id="brief"></p>
    </section>

    <section class="chips-wrap">
      <div class="label">Player</div>
      <div class="chips" id="chips"></div>
      <div class="posname" id="posname"></div>
    </section>

    <section class="board">
      <div class="pitch-wrap">
        <svg id="pitch" viewBox="-6 -6 112 162" aria-label="Pitch. Drag the gold player.">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
              <path d="M0 0L10 5L0 10z" class="arrowhead"></path>
            </marker>
          </defs>
          <g id="g-grass"></g>
          <g id="g-lines">
            <rect class="chalk" x="0" y="0" width="100" height="150"></rect>
            <line class="chalk" x1="0" y1="75" x2="100" y2="75"></line>
            <circle class="chalk" cx="50" cy="75" r="12"></circle>
            <circle class="chalk-dot" cx="50" cy="75" r=".7"></circle>
            <rect class="chalk" x="22" y="0" width="56" height="22"></rect>
            <rect class="chalk" x="36" y="0" width="28" height="7"></rect>
            <circle class="chalk-dot" cx="50" cy="15" r=".6"></circle>
            <path class="chalk" d="M42.86 22 A10 10 0 0 0 57.14 22"></path>
            <rect class="chalk" x="22" y="128" width="56" height="22"></rect>
            <rect class="chalk" x="36" y="143" width="28" height="7"></rect>
            <circle class="chalk-dot" cx="50" cy="135" r=".6"></circle>
            <path class="chalk" d="M42.86 128 A10 10 0 0 1 57.14 128"></path>
            <path class="chalk" d="M2 0 A2 2 0 0 1 0 2 M98 0 A2 2 0 0 0 100 2 M0 148 A2 2 0 0 1 2 150 M100 148 A2 2 0 0 0 98 150"></path>
            <rect class="goal" x="44" y="-3" width="12" height="3"></rect>
            <rect class="goal" x="44" y="150" width="12" height="3"></rect>
          </g>
          <g id="g-help"></g>
          <g id="g-ghost"></g>
          <g id="g-them"></g>
          <g id="g-us"></g>
          <g id="g-ball"></g>
          <g id="g-draw"></g>
        </svg>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="tools" aria-label="Tools">
      <button class="btn primary" id="check">Check</button>
      <button class="btn" id="showme">Show me</button>
      <button class="btn" id="draw" aria-pressed="false">Draw</button>
      <button class="btn" id="moveall" aria-pressed="false">Move team</button>
      <button class="btn" id="reset">Reset</button>
    </section>

    <section class="info">
      <div class="card" id="answer"></div>
      <div class="card ask"><div class="label">Ask them</div><p id="ask"></p></div>
    </section>
  </main>
</div>

<script>
// Pitch: x 0-100 left to right, y 0 (their goal) to 150 (our goal). We attack upwards.
const POS = [
  { k: 'GK', n: 1,  name: 'Goalkeeper' },
  { k: 'LB', n: 3,  name: 'Left Back' },
  { k: 'CB', n: 5,  name: 'Centre Back' },
  { k: 'RB', n: 2,  name: 'Right Back' },
  { k: 'DM', n: 6,  name: 'Holding Mid' },
  { k: 'LW', n: 11, name: 'Left Wing' },
  { k: 'AM', n: 10, name: 'Attacking Mid' },
  { k: 'RW', n: 7,  name: 'Right Wing' },
  { k: 'ST', n: 9,  name: 'Striker' },
];
const POSMAP = Object.fromEntries(POS.map(p => [p.k, p]));
// Where the chosen player starts before they move: our basic shape
const START = { GK: [50, 140], LB: [24, 115], CB: [50, 118], RB: [76, 115], DM: [50, 98], LW: [15, 78], AM: [50, 80], RW: [85, 78], ST: [50, 60] };

const BASE = [
  { id: 'goalkick', group: 'We have the ball', title: 'Our goal kick', phase: 'att', carrier: 'GK', ball: [50, 142],
    brief: 'Our goal kick. Their forwards are pushing up to press. We want to play out from the back.',
    ask: 'Which of our players is free right now? How do you know?',
    us: {
      GK: [50, 143, 'You have the ball. Look for the free defender first, and pass to the side with fewer of their players.'],
      LB: [9, 128, 'Go wide, right out to the touchline, level with the edge of the box. Being wide pulls their forward away from the middle and gives the keeper an easy pass with time to turn.'],
      CB: [42, 127, 'Stand at the edge of the box, a little to one side of their striker. If you are marked, stay put as the safe pass back. If they go wide, you are free.'],
      RB: [91, 128, 'Go wide, right out to the touchline, level with the edge of the box. Being wide pulls their forward away from the middle and gives the keeper an easy pass with time to turn.'],
      DM: [60, 106, 'Find the gap between their forwards and face up the pitch. Check over your shoulder before the ball comes so you can turn and play forward.'],
      LW: [5, 90, 'Stay high and on the touchline. You make the pitch big, which stretches their defence and opens gaps in the middle.'],
      AM: [26, 94, 'Drop into the pocket between their midfielders on one side. Be ready for the second pass, from our defender to you.'],
      RW: [95, 90, 'Stay high and on the touchline. You make the pitch big, which stretches their defence and opens gaps in the middle.'],
      ST: [50, 74, 'Stay high, right on their last defender. You push their defence back, which gives our midfield more room. If they press hard, the keeper can go long to you.'],
    },
    them: [[50, 5], [24, 70], [50, 68], [76, 70], [40, 92], [62, 95], [30, 116], [48, 118], [72, 116]] },

  { id: 'cb-ball', group: 'We have the ball', title: 'Centre back on the ball', phase: 'att', carrier: 'CB', ball: [50, 115],
    brief: 'Our centre back has the ball. Their striker is closing them down.',
    ask: 'Can the ball reach you in a straight line? If not, how many steps do you need to take?',
    us: {
      GK: [44, 136, 'Stay behind the centre back and a few steps to the side. If they get pressed, you are the safe pass back.'],
      LB: [10, 108, 'Get wide and a little higher than the centre back. Open your body so you are facing up the pitch when the ball arrives.'],
      CB: [50, 117, 'You have the ball. If nobody presses, run forward with it. Look for the holding mid first, then the wide defenders.'],
      RB: [90, 108, 'Get wide and a little higher than the centre back. Open your body so you are facing up the pitch when the ball arrives.'],
      DM: [62, 100, 'Get out of their striker’s shadow. If their player is standing between you and the ball, take a few steps sideways until there is a clear line.'],
      LW: [5, 72, 'Stay high and wide. If their defender comes out to you, a gap opens inside for the attacking mid.'],
      AM: [32, 80, 'Find the gap between their midfield and their defence on the side the ball can reach.'],
      RW: [95, 72, 'Stay high and wide. If their defender comes out to you, a gap opens inside for the attacking mid.'],
      ST: [50, 56, 'Stay central against their middle defender. Keep them busy so they cannot step into midfield.'],
    },
    them: [[50, 5], [26, 50], [50, 48], [74, 50], [42, 84], [60, 82], [30, 98], [50, 104], [70, 98]] },

  { id: 'att-left', group: 'We have the ball', title: 'Attacking down the left', phase: 'att', carrier: 'LW', ball: [12, 52],
    brief: 'Our left winger has the ball high up the pitch. Time to create a chance.',
    ask: 'Where will the cross land? Who needs to be there?',
    us: {
      GK: [50, 116, 'Come off your line to the edge of the box or further. If they win it and kick it long, you sweep it up.'],
      LB: [24, 72, 'Support behind the winger, a few metres inside. Give them a safe pass back if they get stuck.'],
      CB: [52, 92, 'Push up but stay goal-side of their striker. If we lose the ball, you are the one who stops the counter.'],
      RB: [72, 94, 'Tuck in towards the middle. The ball is far away, so cover the centre and keep their forward in front of you.'],
      DM: [40, 66, 'Stay behind the ball and slightly inside. Be ready to switch play or win the ball back if we lose it.'],
      LW: [12, 52, 'You have the ball. Take on your defender, cross it, or pass inside to the attacking mid.'],
      AM: [32, 48, 'Get close and inside, in the gap. A short pass to you means you can shoot or slip the striker in.'],
      RW: [60, 13, 'Get into the box at the back post. Crosses that go over everyone land here.'],
      ST: [42, 11, 'Attack the near post. Time your run so you arrive as the ball is crossed, not before.'],
    },
    them: [[50, 4], [14, 44], [42, 24], [64, 26], [36, 58], [56, 60], [40, 74], [56, 82], [78, 86]] },

  { id: 'their-gk', group: 'They have the ball', title: 'Their goal kick (press)', phase: 'def', carrier: null, ball: [50, 6],
    brief: 'Their keeper has a goal kick. We press high to win the ball near their goal.',
    ask: 'If the keeper passes short, who do you press? What if they kick it long?',
    us: {
      GK: [50, 124, 'Push up to the edge of your box. Our defenders are high, so you cover the space behind them.'],
      LB: [24, 86, 'Stay goal-side of their forward on your side, a couple of metres away. If the ball goes long, you get there first.'],
      CB: [50, 90, 'Stay goal-side of their striker. You are the last line, so don’t get pulled out wide.'],
      RB: [76, 86, 'Stay goal-side of their forward on your side, a couple of metres away. If the ball goes long, you get there first.'],
      DM: [42, 54, 'Stay close to their spare midfielder. If they pass through our press, you are the one who stops it.'],
      LW: [16, 27, 'Wait just outside the box near their wide defender. The moment the keeper passes to them, press and stop them turning.'],
      AM: [60, 50, 'Mark their midfielder, goal-side, so the keeper cannot pass into the middle.'],
      RW: [84, 27, 'Wait just outside the box near their wide defender. The moment the keeper passes to them, press and stop them turning.'],
      ST: [50, 24, 'Stand right in front of their middle defender so the keeper can’t pass to them. Force them to go wide or long.'],
    },
    them: [[50, 6], [12, 18], [50, 30], [88, 18], [40, 44], [62, 46], [22, 76], [50, 78], [78, 76]] },

  { id: 'mid-block', group: 'They have the ball', title: 'Their ball in midfield', phase: 'def', carrier: null, ball: [44, 70],
    brief: 'Their midfielder has the ball in the middle of the pitch. We stay compact.',
    ask: 'What is the most dangerous pass they could make? Who is blocking it?',
    us: {
      GK: [50, 128, 'Stand off your line, near the penalty spot or higher, ready to sweep up any ball over the top.'],
      LB: [32, 106, 'Squeeze in narrow and stay goal-side of their forward. The ball is in the middle, so that is where the danger is.'],
      CB: [50, 108, 'Stay central and level with the other two defenders. Keep the line together and don’t drop off on your own.'],
      RB: [68, 106, 'Squeeze in narrow and stay goal-side of their forward. The ball is in the middle, so that is where the danger is.'],
      DM: [48, 92, 'Sit in front of the defenders in the middle. Block the pass into their striker’s feet.'],
      LW: [26, 82, 'Come inside and stay level with the attacking mid, so they can’t pass through the gap between you.'],
      AM: [44, 76, 'Press the ball. Get goal-side and push them away from the middle.'],
      RW: [66, 82, 'Come inside and stay level with the attacking mid, so they can’t pass through the gap between you.'],
      ST: [48, 56, 'Stand in the passing line back to their defenders. If we win the ball, you are ready to go.'],
    },
    them: [[50, 6], [22, 42], [50, 38], [78, 42], [44, 70], [66, 64], [30, 98], [50, 100], [72, 96]] },

  { id: 'def-left', group: 'They have the ball', title: 'Defending our left side', phase: 'def', carrier: null, ball: [12, 104],
    brief: 'Their winger is running at us down our left side.',
    ask: 'Where is the space they want to cross into? Who is guarding it?',
    us: {
      GK: [45, 145, 'Shift towards the ball side but don’t leave the far post open. Stand on the line between the ball and the middle of the goal.'],
      LB: [15, 110, 'Get goal-side of their winger and press. Show them down the line, never inside.'],
      CB: [40, 127, 'Slide across towards the ball to cover behind the left back. Stay goal-side of their striker.'],
      RB: [62, 128, 'Tuck in to guard the middle of the box. The danger is the cross, not your touchline.'],
      DM: [30, 116, 'Drop to the edge of the box on the ball side. Block the pass cut back to the edge of the box.'],
      LW: [20, 96, 'Sprint back and help the left back. Two against one wins the ball back.'],
      AM: [42, 98, 'Get compact on the ball side and close their nearest midfielder.'],
      RW: [66, 104, 'Tuck in narrow towards the edge of the box. The far side is less dangerous right now.'],
      ST: [54, 76, 'Stay up near halfway. When we win it, you are our outlet for a quick counter.'],
    },
    them: [[50, 6], [24, 54], [50, 46], [76, 54], [30, 90], [54, 86], [12, 104], [44, 120], [68, 118]] },

  { id: 'lost-ball', group: 'Just lost it', title: 'We just lost the ball', phase: 'def', carrier: null, ball: [60, 58],
    brief: 'We just lost the ball in their half. The next 5 seconds matter most.',
    ask: 'Do you press or drop back? Why?',
    us: {
      GK: [50, 126, 'Get up to the edge of the box. Any long ball over our defence is yours.'],
      LB: [36, 100, 'Tuck in narrow and take a few steps back. Keep their forwards in front of you.'],
      CB: [50, 104, 'Drop a few steps and stay central. Slow their striker down and don’t dive in.'],
      RB: [70, 98, 'Get goal-side of the nearest forward straight away.'],
      DM: [54, 78, 'Get in front of our defence in the middle and block the direct pass forward. Slow them down.'],
      LW: [36, 72, 'Sprint back inside to help. Recover towards the middle, not the touchline.'],
      AM: [54, 63, 'Counter-press! Close down the player on the ball together with the winger.'],
      RW: [66, 54, 'You were closest when we lost it. Press straight away, hard, for 5 seconds.'],

  (function step(now) {
    const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);
    state.cur.us[k] = [from[0] + (to[0] - from[0]) * e, from[1] + (to[1] - from[1]) * e];
    render();
    if (t < 1) requestAnimationFrame(step);
  })(t0);
}

sel.addEventListener('change', () => loadScenario(+sel.value));
$('#prev').addEventListener('click', () => loadScenario(state.si - 1));
$('#next').addEventListener('click', () => loadScenario(state.si + 1));
$('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) selectPos(b.dataset.k); });
$('#check').addEventListener('click', () => { state.revealed = !state.revealed; render(); });
$('#showme').addEventListener('click', showMe);
$('#draw').addEventListener('click', () => {
  state.draw = !state.draw; render();
});
$('#moveall').addEventListener('click', () => { state.moveAll = !state.moveAll; render(); });
$('#reset').addEventListener('click', () => loadScenario(state.si));

loadScenario(state.si);
</script>
